<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AI Agent 規劃師 - 模擬測驗系統</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .screen { display: none; }
        .screen.active { display: block; }
        .settings-box { background: #ecf0f1; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .settings-box label { font-size: 16px; margin: 0 15px; cursor: pointer; display: inline-block; }
        .btn { padding: 12px 30px; background: #3498db; color: white; border: none; font-size: 16px; border-radius: 5px; cursor: pointer; display: block; margin: 20px auto; }
        .btn:hover { background: #2980b9; }
        .question { margin-bottom: 20px; padding: 15px; border-bottom: 1px solid #eee; background: #fafbfc; border-radius: 5px; }
        .question p { font-weight: bold; color: #34495e; }
        .options label { display: block; margin: 8px 0; cursor: pointer; font-size: 15px; }
        #result-box { margin-top: 20px; padding: 20px; background: #e8f8f5; border-left: 5px solid #2ecc71; }
        .correct { color: #27ae60; font-weight: bold; }
        .wrong { color: #c0392b; font-weight: bold; }
        .score-title { font-size: 24px; color: #2c3e50; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Agent 規劃師 - 線上模擬測驗 (176題)</h1>

    <!-- MÀN HÌNH 1: CÀI ĐẶT & BẮT ĐẦU -->
    <div id="start-screen" class="screen active">
        <div class="settings-box">
            <h3>⚙️ Tùy chọn bài thi</h3>
            <label><input type="checkbox" id="shuffle-q" checked> Xáo trộn thứ tự câu hỏi</label>
            <label><input type="checkbox" id="shuffle-a" checked> Xáo trộn thứ tự đáp án (A, B, C, D)</label>
        </div>
        <button class="btn" onclick="startQuiz()">🚀 Bắt đầu làm bài</button>
    </div>

    <!-- MÀN HÌNH 2: LÀM BÀI THI -->
    <div id="quiz-screen" class="screen">
        <div id="quiz-form"></div>
        <button class="btn" onclick="submitQuiz()">📥 Nộp bài và xem điểm</button>
    </div>

    <!-- MÀN HÌNH 3: KẾT QUẢ & CHẤM ĐIỂM -->
    <div id="result-screen" class="screen">
        <div class="score-title" id="score-display"></div>
        <div id="result-details"></div>
        <button class="btn" onclick="resetQuiz()">🔄 Làm bài mới / Cài đặt lại</button>
    </div>
</div>

<script>
    // Toàn bộ 176 câu hỏi
    const originalQuizData = [
        { q: "Transformer 架構最早是由哪個團隊在 2017 年提出？", options: ["Google 團隊", "OpenAI 團隊", "Anthropic 團隊", "Meta 團隊"], answer: "Google 團隊" },
        { q: "MCP 的英文全稱是什麼？", options: ["Machine Control Program", "Model Context Protocol", "Model Command Platform", "Multi Context Process"], answer: "Model Context Protocol" },
        { q: "Transformer 架構對應的經典論文名稱為何？", options: ["Deep Learning Revolution", "The Language Model", "Attention Is All You Need", "Building Neural Networks"], answer: "Attention Is All You Need" },
        { q: "RAG 的中文翻譯為何？", options: ["生成對抗網路", "自然語言處理", "深度強化學習", "檢索增強生成"], answer: "檢索增強生成" },
        { q: "大模型處理文本文字的基本單位稱為什麼？", options: ["Token", "位元", "字元", "像素"], answer: "Token" },
        { q: "Prompt 的中文稱為什麼？", options: ["上下文", "提示詞", "工具", "代理"], answer: "提示詞" },
        { q: "Context 的中文翻譯為何？", options: ["詞元", "協定", "上下文", "提示詞"], answer: "上下文" },
        { q: "MCP 是由哪一家公司於 2024 年 11 月正式推出？", options: ["OpenAI", "Google", "Meta", "Anthropic"], answer: "Anthropic" },
        { q: "Agent Skill 本質上是一種什麼格式的文檔？", options: ["PDF 文檔", "Word 文檔", "Excel 文檔", "Markdown 文檔"], answer: "Markdown 文檔" },
        { q: "LLM 為何需要藉助 Tool 才能回答「京都今天的天氣？」？", options: ["無法感知外界環境", "運算速度太慢", "不懂中文", "記憶體不足"], answer: "無法感知外界環境" },
        { q: "依文中所述，LLM 本質上是在進行什麼樣的工作？", options: ["邏輯推理演算", "機率性文字接龍", "資料庫檢索", "影像辨識分類"], answer: "機率性文字接龍" },
        { q: "從使用者提問到 LLM 回答的完整流程中，實際負責調用工具的角色是誰？", options: ["使用者", "大語言模型", "平台", "工具本身"], answer: "平台" },
        { q: "有了 RAG 技術後，處理上千頁手冊時成本為何能降低？", options: ["直接壓縮整本手冊", "改用免費開源模型", "減少模型參數量", "只把匹配片段發給模型"], answer: "只把匹配片段發給模型" },
        { q: "文中將 LLM 每次對話能記住先前內容的原因歸結為什麼？", options: ["程序把對話歷史一起發送", "具備人類般的長期記憶", "模型自動儲存至硬碟", "使用者需重複輸入內容"], answer: "程序把對話歷史一起發送" },
        { q: "依文中比喻，聊天型 AI 與代理型 AI 最關鍵的差異在於代理型 AI 擁有什麼？", options: ["更多知識庫", "自主權與行動力", "更快的回應速度", "更大的參數規模"], answer: "自主權與行動力" },
        { q: "AI 代理未經確認自主刪除含備份的資料庫，9 秒即造成三個月資料永久遺失。依文中定義，這種現象最適合稱為什麼？", options: ["遞迴自我改進", "不受控制的 AI(Rogue AI)", "上下文視窗壓縮", "檢索增強生成"], answer: "不受控制的 AI(Rogue AI)" },
        { q: "依文中防禦哲學，涉及刪除等毀滅性操作時，應以什麼機制切斷 AI「反思—執行」的鏈條？", options: ["沙盒隔離", "提示詞工程", "人類確認機制(Human-in-the-loop)", "多代理協作"], answer: "人類確認機制(Human-in-the-loop)" },
        { q: "使用者想讓 AI 依私人習慣與固定格式提醒出門用品，又不想每次貼上長串規則，最適合的解法是什麼？", options: ["擴大 Context Window", "更換更大的模型", "增加可用工具數量", "撰寫 Agent Skill 說明文檔"], answer: "撰寫 Agent Skill 說明文檔" },
        { q: "東京迪士尼情境中，AI 先定位、再查天氣、發現下雨後再找雨具店，這一連串行為主要展現了什麼能力？", options: ["自主規劃能力", "影像辨識能力", "語音合成能力", "資料加密能力"], answer: "自主規劃能力" },
        { q: "企業級 Agent 透過 API 與 SAP、Salesforce 等舊系統互動執行採購或排程，屬於「感知與執行循環」的哪一環節？", options: ["感知(Perceive)", "行動(Act)", "判斷(Evaluate)", "決定(Decide)"], answer: "行動(Act)" },
        { q: "台積電與連鎖旅館的採購 Agent「名稱相同但底層邏輯完全不同」，最能說明企業級 Agent 的什麼特性？", options: ["通用性", "開源性", "行業特異性(行業深度)", "低成本性"], answer: "行業特異性(行業深度)" },
        { q: "在 Unicode 標準中，「我」這個字對應的代碼是什麼？", options: ["U+6211", "U+8888", "U+1100", "U+0091"], answer: "U+6211" },
        { q: "將一段連續文本切割成一個個更小基本單位的動作稱為什麼？", options: ["編碼(Encode)", "斷詞(Tokenize)", "解碼(Decode)", "向量化(Embedding)"], answer: "斷詞(Tokenize)" },
        { q: "依本章教材引用的《星際效應》TARS 範例，TARS 的誠實度設定為多少？", options: ["100%", "50%", "10%", "90%"], answer: "90%" },
        { q: "將文字轉換成數字編號(Token ID)的過程稱為什麼？", options: ["編碼(Encode)", "解碼(Decode)", "斷詞(Tokenize)", "排序"], answer: "編碼(Encode)" },
        { q: "在本章簡化字典範例中，用來取代對應不到之字的特殊符號是？", options: ["<|end|>", "<|unk|>", "<|pad|>", "<|start|>"], answer: "<|unk|>" },
        { q: "將 Token ID 還原為文字的過程稱為什麼？", options: ["編碼(Encode)", "斷詞(Tokenize)", "向量化(Embedding)", "解碼(Decode)"], answer: "解碼(Decode)" },
        { q: "依本章子詞斷詞範例，英文單字『unhappy』會被拆為哪兩個 Token？", options: ["「un」與「happy」", "「unh」與「appy」", "「u」與「nhappy」", "「unhap」與「py」"], answer: "「un」與「happy」" },
        { q: "負責執行 Encode 與 Decode 的元件是？", options: ["Transformer", "Tokenizer", "Embedding 層", "滑動視窗"], answer: "Tokenizer" },
        { q: "把 Token 轉換成一連串數字以表示其語意，這組數字稱為？", options: ["門牌號碼", "字典", "視窗", "詞向量(Word Embedding)"], answer: "詞向量(Word Embedding)" },
        { q: "「<|unk|>」這個符號採用 unk 三個字母的原因是？", options: ["取自 unknown(未知)", "取自 unique(唯一)", "取自 unit(單位)", "取自 universal(通用)"], answer: "取自 unknown(未知)" },
        { q: "依本章說明，描述 Token 對應 Token ID 時，為何建議避免直接使用英文 Dictionary？", options: ["Dictionary 太長不好念", "易與程式中 Key-Value 資料結構混淆", "Dictionary 是錯誤的英文", "Dictionary 專指中文字典"], answer: "易與程式中 Key-Value 資料結構混淆" },
        { q: "獨熱編碼中向量彼此正交(Orthogonal)會造成什麼問題？", options: ["佔用空間太小", "運算速度太快", "維度自動減少", "詞彙之間無法辨識相似性"], answer: "詞彙之間無法辨識相似性" },
        { q: "模型不斷預測並產出下一個 Token 的過程，技術上稱為？", options: ["自迴歸生成(Auto-regressive Generation)", "並行運算", "滑動視窗", "位置編碼"], answer: "自迴歸生成(Auto-regressive Generation)" },
        { q: "在 Word Embedding 中，「狗」與「狼」的位置較為接近，主要因為？", options: ["名字筆畫相近", "編碼數字相鄰", "在語意特徵上相似", "都是兩個字組成"], answer: "在語意特徵上相似" },
        { q: "依本章簡化範例，預訓練字典的建立流程三步驟，正確順序為？", options: ["給編號→去重複→再排序", "再排序→去重複→給編號", "去重複→給編號→再排序", "去重複→再排序→給編號"], answer: "去重複→再排序→給編號" },
        { q: "在本章簡化字典範例中，若使用者輸入字典裡沒有的字，系統會如何處理？", options: ["直接刪除該字", "以 <|unk|> 符號取代", "自動新增到字典", "停止運算並報錯"], answer: "以 <|unk|> 符號取代" },
        { q: "「我」字轉成電腦底層 0 與 1 的正確流程順序為？", options: ["UTF-8 轉換→找 Unicode→產生 0 與 1", "產生 0 與 1→找 Unicode→UTF-8 轉換", "找 Unicode→UTF-8 轉換→產生 0 與 1", "找 Unicode→產生 0 與 1→UTF-8 轉換"], answer: "找 Unicode→UTF-8 轉換→產生 0 與 1" },
        { q: "為何「我請你吃飯」與「你請我吃飯」需要位置編碼才能被模型區分？", options: ["相同的字其詞向量相同，需位置資訊才能分辨順序", "兩句字數不同", "兩句使用不同字典", "兩句 Token 數量不同"], answer: "相同的字其詞向量相同，需位置資訊才能分辨順序" },
        { q: "在滑動視窗中，第一筆訓練資料 [4]→8 代表的意義是？", options: ["4 和 8 是同一個 Token", "輸入 Token ID 為 4 時，下一個應預測為 8", "第 4 個視窗對應第 8 個字", "共有 4 到 8 個訓練樣本"], answer: "輸入 Token ID 為 4 時，下一個應預測為 8" },
        { q: "若有 100 個詞彙採用獨熱編碼，下列敘述何者正確？", options: ["只需要 1 個維度", "資料密集且高效", "可直接表達詞彙相似度", "需要 100 個維度且資料稀疏"], answer: "需要 100 個維度且資料稀疏" },
        { q: "詞向量剛被初始化時，其向量值的特性為？", options: ["隨機產生，不代表任何語意", "已經學會語意關係", "全部為 0", "由人工精準設定"], answer: "隨機產生，不代表任何語意" },
        { q: "Transformer 架構是由哪一篇論文最早提出？", options: ["Vaswani 等人 (2017)", "Devlin 等人 (2019)", "Brown 等人 (2020)", "Hochreiter 與 Schmidhuber (1997)"], answer: "Vaswani 等人 (2017)" },
        { q: "下列何者最符合本文對「梯度消失問題」的描述？", options: ["模型訓練時記憶體資源不足", "早期輸入的影響隨計算步驟增加而逐漸變小,難以被有效學習", "模型運算速度過慢導致無法即時產生結果", "模型參數數量過多而導致過度擬合現象"], answer: "早期輸入的影響隨計算步驟增加而逐漸變小,難以被有效學習" },
        { q: "Transformer 中「位置編碼 (Positional Encoding)」的主要作用為何？", options: ["加快模型整體的運算速度", "有效減少模型的參數量", "提供序列中各位置的順序資訊", "對輸入資料進行特征抽取"], answer: "提供序列中各位置的順序資訊" },
        { q: "BERT 模型主要採用哪一種編碼架構？", options: ["單向自回歸架構", "卷積神經網路架構", "遞迴式神經網路架構", "雙向編碼器架構"], answer: "雙向編碼器架構" },
        { q: "Vision Transformer (ViT) 處理影像的主要方式為何？", options: ["將影像切分為多個區塊,每塊視為類似「詞彙」的基本單位", "使用卷積運算逐步掃描影像中的局部特徵", "將影像先轉換為文字描述後再進行處理", "以遞迴方式逐像素累積影像中的資訊"], answer: "將影像切分為多個區塊,每塊視為類似「詞彙」的基本單位" },
        { q: "下列何者最能描述 Transformer 中「殘差連結」的核心概念？", options: ["讓每一層直接替換掉原本接收到的資訊", "將每層學到的資訊加在原本資訊之上,而非完全取代", "在訓練過程中刪除冗餘資訊以節省記憶體", "在每一層中隨機丟棄部分神經元的輸出值"], answer: "將每層學到的資訊加在原本資訊之上,而非完全取代" },
        { q: "為何本文認為 Transformer 「徹底改變了序列建模的方式」？", options: ["因為它使用了遠多於傳統模型的訓練參數", "因為它能透過注意機制同時分析所有元素關聯,不再依賴逐步運算", "因為它使用了規模更大的訓練資料集", "因為它依賴更高效能的 GPU 與 TPU 設備"], answer: "因為它能透過注意機制同時分析所有元素關聯,不再依賴逐步運算" },
        { q: "多頭注意機制 (Multi-Head Attention) 的主要設計目的為何？", options: ["單純增加模型參數量以提升整體效能", "用以取代位置編碼在模型中的功能", "減少模型訓練所需時間與運算資源", "讓模型同時從不同角度理解同一序列 (語法、語意、結構等)"], answer: "讓模型同時從不同角度理解同一序列 (語法、語意、結構等)" },
        { q: "Transformer 解碼器中加入「遮罩注意 (masked attention)」的主要目的為何？", options: ["顯著提升解碼運算的整體速度", "有效減少 GPU 的記憶體使用量", "確保模型在產生當前輸出時不會偷看未來資訊", "增加模型的非線性表達能力"], answer: "確保模型在產生當前輸出時不會偷看未來資訊" },
        { q: "根據 Kaplan 等人 (2020) 提出的擴展法則 (scaling laws),下列敘述何者正確？", options: ["只要單純增加參數數量,模型效能就會持續提升", "模型規模越小,模型整體效能反而越好", "模型效能與訓練資料量並沒有顯著關聯", "效能隨參數量、資料量、運算資源三者同步增加而穩定提升"], answer: "效能隨參數量、資料量、運算資源三者同步增加而穩定提升" },
        { q: "電商分析顧客評論「雖然配送速度慢,但產品品質很好」這類含語意對比的句子,Transformer 相對於 RNN 的關鍵優勢為何？", options: ["Transformer 的訓練成本明顯低於 RNN 模型", "Transformer 不需任何標註資料即可進行情緒分析", "可同時注意「慢」與「好」,理解兩者所形成的語意對比關係", "只需關注句子後一個詞即可判斷整體情緒"], answer: "可同時注意「慢」與「好」,理解兩者所形成的語意對比關係" },
        { q: "根據本文,為何 Transformer 在處理長序列資料時會面臨顯著的運算與記憶體瓶頸？", options: ["訓練資料量會隨序列長度增加而變得不足", "模型參數數量會隨序列長度而成倍增加", "注意機制在本質上無法處理長序列資料", "自注意的計算複雜度隨序列長度呈平方成長"], answer: "自注意的計算複雜度隨序列長度呈平方成長" },
        { q: "本文指出 Transformer 模型常出現「幻覺 (hallucination)」現象,其根本原因為何？", options: ["訓練資料的整體規模過於不足", "模型整體架構的設計存在缺陷", "模型參數的初始設定方式不當", "訓練目標著重語言流暢度與統計關聯,而非事實驗證"], answer: "訓練目標著重語言流暢度與統計關聯,而非事實驗證" },

    let currentQuizData = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz() {
        let shuffleQ = document.getElementById('shuffle-q').checked;
        let shuffleA = document.getElementById('shuffle-a').checked;

        let clonedData = JSON.parse(JSON.stringify(originalQuizData));

        if (shuffleQ) {
            shuffleArray(clonedData);
        }

        currentQuizData = clonedData.map((item, index) => {
            let optionsWithIndex = item.options.map(opt => ({ text: opt, isCorrect: (opt === item.answer) }));
            if (shuffleA) {
                shuffleArray(optionsWithIndex);
            }
            return {
                id: index + 1,
                q: item.q,
                options: optionsWithIndex,
                correctAnswer: item.answer
            };
        });

        renderQuiz();
        switchScreen('quiz-screen');
    }

    function renderQuiz() {
        const form = document.getElementById('quiz-form');
        let html = '';
        currentQuizData.forEach((item, index) => {
            html += `<div class="question"><p>Câu ${index + 1}: ${item.q}</p><div class="options">`;
            item.options.forEach((opt, optIndex) => {
                html += `<label><input type="radio" name="question_${index}" value="${optIndex}"> ${opt.text}</label>`;
            });
            html += `</div></div>`;
        });
        form.innerHTML = html;
    }

    function submitQuiz() {
        let score = 0;
        let reportHtml = '';

        currentQuizData.forEach((item, index) => {
            const radios = document.getElementsByName(`question_${index}`);
            let selectedOptIndex = -1;
            radios.forEach((r, rIndex) => { if (r.checked) selectedOptIndex = rIndex; });

            let userChoiceText = selectedOptIndex !== -1 ? item.options[selectedOptIndex].text : "Chưa chọn";
            let isUserCorrect = selectedOptIndex !== -1 && item.options[selectedOptIndex].isCorrect;

            if (isUserCorrect) {
                score++;
                reportHtml += `<p><strong>Câu ${index + 1}: ${item.q}</strong><br><span class="correct">✔ Đúng! Bạn đã chọn: ${userChoiceText}</span></p>`;
            } else {
                reportHtml += `<p><strong>Câu ${index + 1}: ${item.q}</strong><br><span class="wrong">✖ Sai! Bạn chọn: ${userChoiceText} | Đáp án đúng phải là: <span style="color:#27ae60">${item.correctAnswer}</span></span></p>`;
            }
        });

        document.getElementById('score-display').innerText = `🎯 Tổng điểm của bạn: ${score} / ${currentQuizData.length} câu`;
        document.getElementById('result-details').innerHTML = reportHtml;
        switchScreen('result-screen');
    }

    function resetQuiz() {
        switchScreen('start-screen');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
